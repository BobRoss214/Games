# Postern: the full service on one server.
#
# Use (run all commands in this folder, deploy/):
#   cp .env.example .env        then put your values in the .env file
#   docker compose up -d --build
#
# Services:
#   app    Postern. Web app + API on port 8080 (only Caddy can reach it) and
#          incoming mail on port 25 of the server.
#   caddy  HTTPS for the web app. Gets the certificate automatically.
#   relay  Optional. Sends outgoing mail directly to other mail servers and
#          signs it with DKIM. It starts only if the .env file has
#          COMPOSE_PROFILES=relay
#   smsgate, smsgate-worker, smsgate-db
#          Optional. The gateway for your own Android phone ("own phone"
#          provider): the private server of the open-source app "SMS Gateway
#          for Android", its worker, and its database. They start only if the
#          .env file has the profile "ownphone" in COMPOSE_PROFILES.
#          See Part I of the setup guide.
#
# Two profiles together: COMPOSE_PROFILES=relay,ownphone
#
# Data that you must keep is in the volume "postern_data". See backup.sh.

name: postern

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: postern:local
    restart: unless-stopped
    init: true
    env_file: .env
    # These values are fixed for this deployment. They win over the .env file.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      SMTP_HOST: 0.0.0.0
      SMTP_PORT: "2525"
      DATA_DIR: /data
      # Caddy is in front of the app, so the app reads the visitor address
      # from X-Forwarded-For. This is safe only because port 8080 is not
      # published to the internet. Do not add 8080 to "ports".
      TRUST_PROXY: "true"
    ports:
      # Incoming mail. Port 25 of the server goes to port 2525 in the container.
      - "25:2525"
    volumes:
      - data:/data
      # Optional key and certificate files (DKIM_KEY_FILE, SMTP_TLS_KEY,
      # SMTP_TLS_CERT). Put them in deploy/keys/ . The app sees them in /keys/ .
      - ./keys:/keys:ro
    # The program cannot change its own files. It can write only to /data and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The app log has no request data, no addresses and no IP addresses.
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # The Caddyfile uses this value as the site address.
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in the .env file. Example https://mail.example.com}
      # The second site address, for the gateway of your own phone (profile "ownphone").
      # With no value, Caddy uses a name that exists only inside the server.
      SMSGATE_HOST: ${SMSGATE_HOST:-sms.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"

  # Optional outgoing mail server (Postfix). It is not reachable from the
  # internet: it has no "ports". Only the app container sends mail through it:
  #   SMTP_RELAY_URL=smtp://relay:587/?tls.rejectUnauthorized=false
  relay:
    image: boky/postfix:latest
    profiles:
      - relay
    restart: unless-stopped
    environment:
      # The relay accepts mail only if the sender address is in one of these domains.
      # The list uses spaces. MAIL_DOMAINS uses commas. If you have more than one
      # mail domain, set RELAY_DOMAINS in the .env file.
      ALLOWED_SENDER_DOMAINS: ${RELAY_DOMAINS:-${MAIL_DOMAINS:-}}
      # The name that the relay gives to other mail servers. It must be the same
      # name as the reverse DNS (PTR) record of the server.
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-}
      # The relay makes one DKIM key for each domain at the first start.
      # The DNS name of the key is mail._domainkey.YOUR-DOMAIN
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: mail
      # Largest message: 25 MB. This is more than the default MAIL_MAX_BYTES after encoding.
      POSTFIX_message_size_limit: "26214400"
    volumes:
      # DKIM keys. Image version 6 and later keeps them in /var/lib/rspamd/dkim .
      # Older versions keep them in /etc/opendkim/keys .
      - relay_rspamd:/var/lib/rspamd
      - relay_opendkim:/etc/opendkim/keys
      # Mail that waits for a second delivery attempt.
      - relay_queue:/var/spool/postfix
    # The Postfix log shows the sender and the recipient of each message.
    # Thus the log is off. To find a delivery problem, set RELAY_LOG_DRIVER=local
    # in the .env file for a short time, then set it back to none.
    logging:
      driver: ${RELAY_LOG_DRIVER:-none}

  # ---- Optional: your own phone as the phone provider (profile "ownphone") ----
  #
  # The gateway is the private server of the app "SMS Gateway for Android"
  # (https://github.com/android-sms-gateway/server, Apache-2.0). It is software
  # of a different project. Postern only talks to it.
  #
  #   phone   -->  https://SMSGATE_HOST/api/mobile/v1    (through Caddy; the phone connects out)
  #   Postern -->  http://smsgate:3000/api/3rdparty/v1   (inside Docker only)
  #
  # The gateway has no "ports": it is not published to the internet directly.
  # The settings below follow the compose files of that project
  # (deployments/docker-compose and deployments/docker-compose-proxy).
  # This profile was not started by the authors of this file. Docker was not available.
  smsgate:
    # The release tool of the project gives each image the tag of its version.
    # The tag below is the newest version in the source that the authors read.
    # If Docker cannot find it, set SMSGATE_VERSION=latest in the .env file.
    image: ghcr.io/android-sms-gateway/server:${SMSGATE_VERSION:-v1.52.6}
    profiles:
      - ownphone
    restart: unless-stopped
    depends_on:
      smsgate-db:
        condition: service_healthy
    environment: &smsgate-env
      CONFIG_PATH: config.yml
      DATABASE__PASSWORD: ${SMSGATE_DB_PASSWORD:-}
      # A phone can register only with this token (private mode).
      GATEWAY__PRIVATE_TOKEN: ${SMSGATE_PRIVATE_TOKEN:-}
      # Texts in the gateway database, kept as short as its settings permit:
      # - A sent text is changed to a hash soon after the phone has processed it
      #   (the check runs each 60 seconds, and one more time each hour).
      # - Old rows are deleted: sent texts, and the copies of incoming texts
      #   that the app uploads to the gateway ("inbox").
      MESSAGES__HASHING_INTERVAL_SECONDS: "60"
      TASKS__MESSAGES_HASHING__INTERVAL: 1h
      TASKS__MESSAGES_CLEANUP__INTERVAL: 1h
      TASKS__MESSAGES_CLEANUP__MAX_AGE: ${SMSGATE_KEEP:-24h}
      TASKS__INBOX_CLEANUP__INTERVAL: 1h
      TASKS__INBOX_CLEANUP__MAX_AGE: ${SMSGATE_KEEP:-24h}
    configs:
      - source: smsgate-config
        target: /app/config.yml
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The authors could not check what the gateway writes in its log.
    # After the phone works, you can turn the log off: SMSGATE_LOG_DRIVER=none
    logging: &smsgate-log
      driver: ${SMSGATE_LOG_DRIVER:-local}

  # The same program in "worker" mode. It does the hashing and the deleting above.
  smsgate-worker:
    image: ghcr.io/android-sms-gateway/server:${SMSGATE_VERSION:-v1.52.6}
    profiles:
      - ownphone
    command: ["/app/app", "worker"]
    restart: unless-stopped
    depends_on:
      smsgate-db:
        condition: service_healthy
    environment: *smsgate-env
    configs:
      - source: smsgate-config
        target: /app/config.yml
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *smsgate-log

  # The database of the gateway. The project recommends the "lts" image of MariaDB,
  # so this tag is not a fixed version.
  smsgate-db:
    image: mariadb:lts
    profiles:
      - ownphone
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SMSGATE_DB_ROOT_PASSWORD:-}
      MYSQL_DATABASE: sms
      MYSQL_USER: sms
      MYSQL_PASSWORD: ${SMSGATE_DB_PASSWORD:-}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - smsgate_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"

# The fixed settings of the gateway. Secrets are not here: they come from the .env file.
# (A file with "content" needs Docker Compose 2.23.1 or later.)
configs:
  smsgate-config:
    content: |
      gateway:
        mode: private
      http:
        listen: 0.0.0.0:3000
      database:
        host: smsgate-db
        port: 3306
        user: sms
        database: sms

volumes:
  data:
  caddy_data:
  caddy_config:
  relay_rspamd:
  relay_opendkim:
  relay_queue:
  # The database of the gateway: the registration of each phone, and texts for a short time.
  smsgate_db:

# IPv6 note: with the default network below, Docker changes the address of each
# IPv6 visitor to one internal address. All IPv6 visitors then share one rate
# limit. If you publish an AAAA record, remove the "#" from the three lines
# below. This needs Docker Engine 27 or later and IPv6 on the server.
# This option was not tested with Postern. Test it before you depend on it.
#
# networks:
#   default:
#     enable_ipv6: true
